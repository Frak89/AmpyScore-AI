name: ampy_score_ai
description: "AmpyScore AI: offline score studio, editable 4/4 partitures and experimental frequency stems."
publish_to: none
version: 0.8.0+8

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  record: ^7.1.2
  just_audio: ^0.10.6
  file_picker: ^13.1.0
  audio_decoder: ^0.8.1
  flutter_midi_pro: ^4.0.4
  xml: ^7.0.1
  url_launcher: ^6.3.3
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/soundfonts/GeneralUser-GS.sf2
    - assets/soundfonts/GeneralUser-GS-LICENSE.txt
